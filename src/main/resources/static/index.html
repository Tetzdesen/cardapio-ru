<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cardápio do RU</title>
<meta name="description" content="Cardápio do dia do Restaurante Universitário da UFES Alegre">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230d6efd'/><text x='16' y='21' font-family='system-ui,sans-serif' font-size='13' font-weight='700' fill='%23fff' text-anchor='middle'>RU</text></svg>">
<script>
  // Antes de pintar: sem isso a pagina pisca no tema errado ao carregar
  (function () {
    let tema = null;
    try { tema = localStorage.getItem("tema"); } catch {}
    if (tema !== "claro" && tema !== "escuro") {
      tema = matchMedia("(prefers-color-scheme: dark)").matches ? "escuro" : "claro";
    }
    document.documentElement.dataset.bsTheme = tema === "escuro" ? "dark" : "light";
  })();
</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      integrity="sha384-XGjxtQfXaH2tnPFa9x+ruJTuLE3Aa6LhHSWRr1XeTyhezb4abCG4ccI5AkVDxqC+" crossorigin="anonymous">
<style>
  .selo { cursor: help; text-decoration: none; }
  .icone { display: inline-grid; place-items: center; width: 2.5rem; height: 2.5rem; font-size: 1.25rem; }
</style>
</head>
<body class="bg-body-tertiary">
<nav class="navbar bg-body border-bottom">
  <div class="container">
    <span class="navbar-brand fw-semibold">Cardápio do RU <small class="text-body-secondary fw-normal">· UFES</small></span>
    <button class="btn btn-outline-secondary btn-sm" id="tema" type="button"></button>
  </div>
</nav>

<main class="container py-4">
  <header class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4">
    <div>
      <h1 class="h2 mb-1" id="semana">Cardápio</h1>
      <p class="text-body-secondary mb-0" id="data">carregando…</p>
    </div>
    <form class="d-flex gap-2" id="calendario">
      <div class="input-group">
        <button class="btn btn-outline-secondary" id="anterior" type="button" aria-label="Dia anterior"><i class="bi bi-chevron-left" aria-hidden="true"></i></button>
        <input class="form-control" id="escolha" type="date" aria-label="Data do cardápio" required>
        <button class="btn btn-outline-secondary" id="seguinte" type="button" aria-label="Dia seguinte"><i class="bi bi-chevron-right" aria-hidden="true"></i></button>
      </div>
      <button class="btn btn-primary" id="hoje" type="button">Hoje</button>
    </form>
  </header>

  <section class="row g-4" id="refeicoes" aria-live="polite">
    <div class="col-12 text-center py-5">
      <div class="spinner-border text-primary" role="status"><span class="visually-hidden">Carregando…</span></div>
    </div>
  </section>

  <footer class="d-flex flex-wrap justify-content-between gap-2 mt-4 pt-3 border-top small text-body-secondary" id="rodape"></footer>
</main>
<script>
  // Marcacoes que o site da UFES poe no fim do item, como "Pao Frances (CG)"
  const SELOS = { CG: "contém glúten", CL: "contém lactose" };
  // O prato que define a refeicao ganha destaque; o resto e lista
  const PRINCIPAIS = new Set(["Prato Proteico", "Opção"]);
  const ICONES = { "Desjejum": "bi-cup-hot", "Almoço": "bi-sun", "Jantar": "bi-moon-stars" };

  const $ = (id) => document.getElementById(id);

  function elemento(tag, classe, texto) {
    const e = document.createElement(tag);
    if (classe) e.className = classe;
    if (texto != null) e.textContent = texto;
    return e;
  }

  // Tema -----------------------------------------------------------------

  function rotularTema() {
    const escuro = document.documentElement.dataset.bsTheme === "dark";
    const botao = $("tema");
    botao.textContent = escuro ? "Fundo claro" : "Fundo escuro";
    botao.setAttribute("aria-label", escuro ? "Mudar para fundo claro" : "Mudar para fundo escuro");
  }

  $("tema").addEventListener("click", () => {
    const escuro = document.documentElement.dataset.bsTheme !== "dark";
    document.documentElement.dataset.bsTheme = escuro ? "dark" : "light";
    try { localStorage.setItem("tema", escuro ? "escuro" : "claro"); } catch {}
    rotularTema();
  });
  rotularTema();

  // Cardapio -------------------------------------------------------------

  function item(texto, principal) {
    const linha = elemento("div", principal ? "fs-5 fw-semibold" : null);
    const selos = [];
    // Pode vir mais de uma no mesmo parentese: "Fricasse de Frango (CG/CL)"
    const nome = texto.replace(/\s*\(([A-Z]{2}(?:\/[A-Z]{2})*)\)/g, (todo, grupo) => {
      const siglas = grupo.split("/");
      if (!siglas.every((s) => SELOS[s])) return todo;
      selos.push(...siglas);
      return "";
    });
    linha.append(nome.trim());
    for (const sigla of selos) {
      const s = elemento("abbr", "selo badge text-bg-secondary ms-2 fw-normal", sigla);
      s.title = SELOS[sigla];
      linha.append(s);
    }
    return { linha, selos };
  }

  function coluna(refeicao, usados) {
    const col = elemento("div", "col-12 col-md-4");
    const card = elemento("article", "card h-100 border-0 shadow-sm");

    const cabecalho = elemento("div", "card-header bg-body d-flex align-items-center gap-3 py-3");
    const icone = elemento("span", "icone rounded-3 bg-primary-subtle text-primary-emphasis");
    icone.append(elemento("i", `bi ${ICONES[refeicao.refeicao] || "bi-egg-fried"}`));
    icone.firstChild.setAttribute("aria-hidden", "true");
    const titulo = elemento("div");
    titulo.append(elemento("h2", "h5 mb-0", refeicao.refeicao));
    for (const h of refeicao.horarios || []) {
      const texto = h.fechado ? `${h.unidade}: sem atendimento`
          : `${h.unidade}: ${h.faixa}${h.reduzido ? " (horário reduzido)" : ""}`;
      const cor = h.fechado ? "text-danger" : h.reduzido ? "text-warning-emphasis" : "text-body-secondary";
      titulo.append(elemento("div", `small ${cor}`, texto));
    }
    cabecalho.append(icone, titulo);
    card.append(cabecalho);

    const ul = elemento("ul", "list-group list-group-flush");
    for (const secao of refeicao.secoes) {
      if (!secao.itens.length) continue;
      const li = elemento("li", "list-group-item py-3");
      li.append(elemento("div", "small text-uppercase fw-semibold text-body-secondary mb-1", secao.rotulo));
      for (const i of secao.itens) {
        const { linha, selos } = item(i, PRINCIPAIS.has(secao.rotulo));
        selos.forEach((s) => usados.add(s));
        li.append(linha);
      }
      ul.append(li);
    }
    card.append(ul);
    col.append(card);
    return col;
  }

  function mostrarData(iso) {
    const [a, m, d] = iso.split("-").map(Number);
    const data = new Date(a, m - 1, d);
    const semana = data.toLocaleDateString("pt-BR", { weekday: "long" });
    $("semana").textContent = semana.charAt(0).toUpperCase() + semana.slice(1);
    $("data").textContent = data.toLocaleDateString("pt-BR",
        { day: "numeric", month: "long", year: "numeric" });
    document.title = `Cardápio do RU · ${data.toLocaleDateString("pt-BR")}`;
  }

  function vazio(texto, tipo = "secondary") {
    const col = elemento("div", "col-12");
    col.append(elemento("div", `alert alert-${tipo} mb-0`, texto));
    $("refeicoes").replaceChildren(col);
  }

  // Calendario -----------------------------------------------------------

  // "Hoje" e o de Alegre, nao o do navegador: o servidor decide o dia no mesmo fuso
  const hojeEmAlegre = () =>
      new Date().toLocaleDateString("en-CA", { timeZone: "America/Sao_Paulo" });

  function somarDias(iso, dias) {
    const [a, m, d] = iso.split("-").map(Number);
    const data = new Date(Date.UTC(a, m - 1, d + dias));
    return data.toISOString().slice(0, 10);
  }

  // A data escolhida fica na URL para o link poder ser compartilhado
  function irPara(iso) {
    const url = new URL(location.href);
    if (iso && iso !== hojeEmAlegre()) url.searchParams.set("data", iso);
    else url.searchParams.delete("data");
    history.replaceState(null, "", url);
    carregar(iso || hojeEmAlegre());
  }

  $("escolha").addEventListener("change", (e) => { if (e.target.value) irPara(e.target.value); });
  $("anterior").addEventListener("click", () => irPara(somarDias($("escolha").value, -1)));
  $("seguinte").addEventListener("click", () => irPara(somarDias($("escolha").value, 1)));
  $("hoje").addEventListener("click", () => irPara(null));
  $("calendario").addEventListener("submit", (e) => e.preventDefault());

  // Carga ----------------------------------------------------------------

  // O spinner que vem no HTML serve de modelo para as cargas seguintes
  const CARREGANDO = $("refeicoes").firstElementChild.cloneNode(true);
  let pedidoAtual = 0;

  async function carregar(iso) {
    // Cliques rapidos nas setas: so a resposta do ultimo pedido vale
    const pedido = ++pedidoAtual;
    const ehHoje = iso === hojeEmAlegre();
    $("escolha").value = iso;
    $("hoje").disabled = ehHoje;
    mostrarData(iso);
    $("rodape").replaceChildren();
    $("refeicoes").replaceChildren(CARREGANDO.cloneNode(true));

    let resposta;
    try {
      resposta = await fetch(`api/v1/cardapios/${iso}?refeicoes=todas`);
    } catch {
      if (pedido !== pedidoAtual) return;
      return vazio("Não foi possível falar com o servidor.", "danger");
    }
    if (pedido !== pedidoAtual) return;

    const dia = ehHoje ? "de hoje" : "deste dia";
    if (!resposta.ok) {
      const motivo = {
        502: `O site do RU não publicou o cardápio ${dia}, ou mudou de formato.`,
        504: "O site do RU está fora do ar no momento.",
      }[resposta.status] || `Erro ${resposta.status} ao buscar o cardápio.`;
      return vazio(motivo, "warning");
    }

    const c = await resposta.json();
    if (pedido !== pedidoAtual) return;
    const comItens = c.refeicoes.filter((r) => r.secoes.some((s) => s.itens.length));

    const usados = new Set();
    const fechado = (c.semRu || []).find((d) => d.dia === iso);
    if (fechado && !comItens.length) {
      vazio(`Não tem RU ${ehHoje ? "hoje" : "neste dia"} (${fechado.unidades.join(" e ")}), `
          + "segundo os avisos do RU.",
          "warning");
    } else if (!c.publicado || !comItens.length) {
      vazio(`O cardápio ${dia} ainda não foi publicado.`, "info");
    } else {
      $("refeicoes").replaceChildren(...comItens.map((r) => coluna(r, usados)));
    }

    const rodape = $("rodape");
    const esquerda = elemento("span");
    if (comItens[0]?.campus) esquerda.append(`Campus ${comItens[0].campus} · `);
    const link = elemento("a", "link-secondary", "fonte");
    link.href = c.origem;
    link.rel = "noopener";
    esquerda.append(link);
    rodape.append(esquerda);
    if (usados.size) {
      rodape.append(elemento("span", null,
          [...usados].sort().map((s) => `${s} ${SELOS[s]}`).join(" · ")));
    }
  }

  const pedida = new URLSearchParams(location.search).get("data");
  irPara(/^\d{4}-\d{2}-\d{2}$/.test(pedida || "") ? pedida : null);
</script>
</body>
</html>
