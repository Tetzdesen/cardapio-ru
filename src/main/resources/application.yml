spring:
  application:
    name: cardapio-ru
  main:
    # o banner iria para a saida do '--print' junto com o cardapio
    banner-mode: "off"
    # O caminho que roda todo dia e o disparo de uma tacada so. O padrao deve ser
    # o caminho comum, para que uma variavel esquecida no Actions nao faca o job
    # subir um servidor e ficar pendurado ate o timeout. Perfil 'web' sobe a API.
    web-application-type: none
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

cardapio:
  url-base: https://restaurante.alegre.ufes.br/cardapio
  user-agent: "ru-alegre-bot/3.0 (uso pessoal; +https://github.com/Tetzdesen/cardapio-ru)"
  timeout: 30s
  tentativas: 3
  espera-base: 2s
  espera-maxima: 60s
  # Teto do orcamento inteiro de tentativas. Precisa caber no timeout que o
  # cliente (o curl do workflow) espera, senao ele desiste enquanto a aplicacao
  # ainda esta tentando e ninguem descobre o que aconteceu.
  orcamento-total: 75s
  retencao-dias: 30
  # Alegre/ES nao tem horario de verao desde 2019; offset fixo, como no ru_bot.py.
  fuso: "-03:00"
  cache: 60s
  # Abaixo disso a area de conteudo nao tem texto suficiente para ser uma pagina
  # de cardapio de verdade. O rodape institucional sozinho da ~300 caracteres.
  limiar-conteudo: 400

estado:
  # Arquivo versionado com o projeto: o runner do agendamento e efemero, entao o
  # que precisa sobreviver entre execucoes volta para o repositorio num commit.
  # Mesmo formato do ru_bot.py -- o arquivo que ja existe continua valendo.
  caminho: ${ESTADO:estado/ultimo-envio.json}

telegram:
  token: ${TELEGRAM_TOKEN:}
  chat-id: ${TELEGRAM_CHAT_ID:}
  url-base: https://api.telegram.org
  timeout: 30s
  limite-mensagem: 4000

# O WAHA que liga o bot a um grupo de WhatsApp (ver whatsapp/README.md). Sem os
# tres primeiros, o canal fica de fora e so o Telegram recebe.
whatsapp:
  url-base: ${WHATSAPP_URL:}
  api-key: ${WHATSAPP_API_KEY:}
  chat-id: ${WHATSAPP_CHAT_ID:}
  sessao: ${WHATSAPP_SESSAO:default}
  timeout: 30s
  limite-mensagem: 4000

api:
  token: ${API_TOKEN:}

# O anuncio pela propria API (perfil 'web'), para hospedar sem agendador externo.
# Desligado por padrao: so o host de verdade liga, com AGENDA_ATIVA=true.
agenda:
  ativa: ${AGENDA_ATIVA:false}
  fuso: America/Sao_Paulo
  # Uma mensagem por refeicao, um pouco antes de o RU abrir para ela.
  desjejum: "0 40 5 * * MON-FRI"
  almoco: "0 30 10 * * MON-FRI"
  jantar: "0 30 16 * * MON-FRI"
  # O Render injeta RENDER_EXTERNAL_URL. Abaixo dos 15 minutos que ele espera
  # antes de desligar o servico por inatividade.
  url-publica: ${RENDER_EXTERNAL_URL:}
  manter-acordado: 10m

logging:
  level:
    io.github.tetzdesen.cardapioru: INFO
