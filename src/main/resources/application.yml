spring:
  application:
    name: cardapio-ru
  main:
    # o banner iria para a saida do '--print' junto com o cardapio
    banner-mode: "off"
    # Sem perfil, o jar e o disparo de uma tacada so da linha de comando: roda e
    # sai, sem subir servidor. O perfil 'web' sobe a API (e o Dockerfile o liga).
    web-application-type: none
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

cardapio:
  url-base: https://restaurante.alegre.ufes.br/cardapio
  user-agent: "ru-alegre-bot/3.0 (uso pessoal; +https://github.com/Tetzdesen/cardapio-ru)"
  timeout: 30s
  tentativas: 3
  espera-base: 2s
  espera-maxima: 60s
  # Teto do orcamento inteiro de tentativas. Precisa caber no timeout de quem
  # chama a API, senao ele desiste enquanto a aplicacao ainda esta tentando.
  orcamento-total: 75s
  retencao-dias: 30
  # Alegre/ES nao tem horario de verao desde 2019; offset fixo, como no ru_bot.py.
  fuso: "-03:00"
  cache: 60s
  # Abaixo disso a area de conteudo nao tem texto suficiente para ser uma pagina
  # de cardapio de verdade. O rodape institucional sozinho da ~300 caracteres.
  limiar-conteudo: 400

estado:
  # Mesmo formato do ru_bot.py. Fica fora do git; no Render, o espelho abaixo e
  # o que o faz sobreviver ao reinicio.
  caminho: ${ESTADO:estado/ultimo-envio.json}
  # Espelho no GitHub, para o estado sobreviver ao deploy e ao reinicio do Render.
  # Sem token, o estado vive so no disco. O ramo nao e o main: commit no main e
  # deploy no Render, e um deploy por anuncio reiniciaria o servico.
  github:
    url-base: https://api.github.com
    repositorio: ${ESTADO_GITHUB_REPO:Tetzdesen/cardapio-ru}
    ramo: ${ESTADO_GITHUB_RAMO:estado}
    caminho: estado/ultimo-envio.json
    token: ${ESTADO_GITHUB_TOKEN:}
    timeout: 20s

telegram:
  token: ${TELEGRAM_TOKEN:}
  chat-id: ${TELEGRAM_CHAT_ID:}
  # Chat privado que recebe as falhas do anuncio agendado; vazio, elas so vao ao log.
  chat-alerta: ${TELEGRAM_CHAT_ALERTA:}
  url-base: https://api.telegram.org
  timeout: 30s
  limite-mensagem: 4000

# O WAHA que liga o bot a um grupo de WhatsApp (ver whatsapp/README.md). Sem os
# tres primeiros, o canal fica de fora e so o Telegram recebe.
whatsapp:
  url-base: ${WHATSAPP_URL:}
  api-key: ${WHATSAPP_API_KEY:}
  chat-id: ${WHATSAPP_CHAT_ID:}
  sessao: ${WHATSAPP_SESSAO:default}
  timeout: 30s
  limite-mensagem: 4000

api:
  token: ${API_TOKEN:}

# O anuncio pela propria API (perfil 'web'), para hospedar sem agendador externo.
# Desligado por padrao: so o host de verdade liga, com AGENDA_ATIVA=true.
agenda:
  ativa: ${AGENDA_ATIVA:false}
  fuso: America/Sao_Paulo
  # Uma mensagem por refeicao, um pouco antes de o RU abrir para ela. Sabado so
  # tem almoco, e o site publica o cardapio dele.
  desjejum: "0 40 5 * * MON-FRI"
  almoco: "0 30 10 * * MON-SAT"
  jantar: "0 30 16 * * MON-FRI"
  # Tenta de novo o anuncio que falhou, ate o prazo da refeicao: depois disso o
  # RU ja esta fechando e anunciar nao serve a ninguem.
  recuperacao: "0 */10 5-19 * * MON-SAT"
  prazo:
    desjejum: "07:30"
    almoco: "13:00"
    jantar: "19:00"
  # Reconfere o site e reanuncia so o que ja foi anunciado e mudou depois.
  vigia: "0 */20 6-19 * * MON-FRI"
  # O Render injeta RENDER_EXTERNAL_URL. Abaixo dos 15 minutos que ele espera
  # antes de desligar o servico por inatividade.
  url-publica: ${RENDER_EXTERNAL_URL:}
  manter-acordado: 10m

logging:
  level:
    io.github.tetzdesen.cardapioru: INFO
