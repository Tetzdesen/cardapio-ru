<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .caixa { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .app { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.5; }
      .ext { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .tit { font-size: 15px; font-weight: 600; fill: #0f172a; }
      .sub { font-size: 12px; fill: #475569; }
      .rot { font-size: 11.5px; fill: #64748b; }
      .lin { stroke: #475569; stroke-width: 1.5; fill: none; marker-end: url(#seta); }
    </style>
  </defs>

  <rect width="960" height="420" fill="#ffffff"/>

  <!-- origem -->
  <rect class="ext" x="24" y="70" width="190" height="70" rx="10"/>
  <text class="tit" x="119" y="100" text-anchor="middle">Site do RU (Plone)</text>
  <text class="sub" x="119" y="120" text-anchor="middle">página do cardápio</text>

  <rect class="ext" x="24" y="200" width="190" height="70" rx="10"/>
  <text class="tit" x="119" y="230" text-anchor="middle">Notícias do RU</text>
  <text class="sub" x="119" y="250" text-anchor="middle">horário especial, dia fechado</text>

  <!-- aplicação -->
  <rect x="262" y="30" width="476" height="360" rx="14" fill="none" stroke="#3b82f6" stroke-width="1.2" stroke-dasharray="2 4"/>
  <text class="rot" x="276" y="52">Spring Boot · Java 21 · Render (plano grátis, sem banco)</text>

  <rect class="app" x="282" y="70" width="190" height="70" rx="10"/>
  <text class="tit" x="377" y="98" text-anchor="middle">Coleta + parser</text>
  <text class="sub" x="377" y="118" text-anchor="middle">jsoup, retry, TLS da RNP</text>

  <rect class="app" x="282" y="200" width="190" height="70" rx="10"/>
  <text class="tit" x="377" y="228" text-anchor="middle">Leitor de avisos</text>
  <text class="sub" x="377" y="248" text-anchor="middle">lista e texto corrido</text>

  <rect class="app" x="526" y="135" width="190" height="70" rx="10"/>
  <text class="tit" x="621" y="163" text-anchor="middle">O que é novidade?</text>
  <text class="sub" x="621" y="183" text-anchor="middle">inédita · alterada · igual</text>

  <rect class="app" x="526" y="300" width="190" height="70" rx="10"/>
  <text class="tit" x="621" y="328" text-anchor="middle">Estado de envio</text>
  <text class="sub" x="621" y="348" text-anchor="middle">arquivo + espelho no GitHub</text>

  <rect class="app" x="282" y="300" width="190" height="70" rx="10"/>
  <text class="tit" x="377" y="328" text-anchor="middle">Agendador</text>
  <text class="sub" x="377" y="348" text-anchor="middle">05h40 · vigia · recuperação</text>

  <!-- canais -->
  <rect class="caixa" x="786" y="95" width="150" height="56" rx="10"/>
  <text class="tit" x="861" y="128" text-anchor="middle">Telegram</text>
  <rect class="caixa" x="786" y="190" width="150" height="56" rx="10"/>
  <text class="tit" x="861" y="216" text-anchor="middle">WhatsApp</text>
  <text class="sub" x="861" y="234" text-anchor="middle">WAHA na Oracle</text>

  <!-- setas -->
  <path class="lin" d="M214,105 H278"/>
  <path class="lin" d="M214,235 H278"/>
  <path class="lin" d="M472,105 C500,105 500,160 522,160"/>
  <path class="lin" d="M472,235 C500,235 500,180 522,180"/>
  <path class="lin" d="M716,160 C750,160 750,123 782,123"/>
  <path class="lin" d="M716,180 C750,180 750,218 782,218"/>
  <path class="lin" d="M861,246 V335 H720"/>
  <text class="rot" x="728" y="358">grava só o que</text>
  <text class="rot" x="728" y="373">o canal confirmou</text>
  <path class="lin" d="M621,300 V209"/>
  <text class="rot" x="628" y="262">já anunciado</text>
  <path class="lin" d="M377,300 V274"/>
  <text class="rot" x="384" y="290">dispara</text>
</svg>
